# CEnum is NOT a dependency. Generated code says `using CEnum: CEnum, @cenum`, but that is the
# caller's `using`, in the caller's environment — the generator only ever writes the string.
# Its one real importer here was src/cltypes.jl, deleted with the rest of the libclang layer.

# Test dependencies live in test/Project.toml, which Julia prefers over [extras]/[targets]
# whenever it exists. The [extras] block that used to sit here listed BinaryBuilder, Tar,
# p7zip_jll and `CMake` -- none of them reachable, and the tests actually use `CMake_jll`.
